name: Mods

# The mod dev loop from CLAUDE.md, steps 1 to 3: validate, tsc, test.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # A fork's pull_request gets no secrets, so the types step could not authenticate: skip
    # it rather than fail it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      MOD: plugins/smart-compact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The plugin API is early access and shifts between builds: bump this pin
      # only together with a re-run of the whole loop. Exact versions with no
      # lockfile, since the repo has no JS stack of its own yet.
      - name: Install Claude Code 2.1.288 and TypeScript
        run: npm install -g @anthropic-ai/claude-code@2.1.288 typescript@7.0.2 # zizmor: ignore[adhoc-packages]

      - name: Validate the marketplace and the mod
        run: |
          claude plugin validate .
          claude plugin validate "$MOD"

      # The engine writes a mod's types when a session loads it. `validate` and
      # `test` do not, so one headless turn does (seen on 2.1.288).
      - name: Generate the plugin types
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "reply ok" --model haiku --plugin-dir "$MOD" < /dev/null

      - name: tsc
        run: tsc -p "$MOD"

      - name: Test
        run: claude plugin test "$MOD"
