exclude: ^(\.claude/skills/)
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        files: (\.(md|markdown)$|^\.github/workflows/[^/]+\.ya?ml$)
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --fix
        language: system
        types_or: [markdown]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: actionlint
        name: actionlint
        entry: actionlint -pyflakes=
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: zizmor --offline --fix
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
