exclude: ^(\.claude/skills/)
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        types_or: [markdown]
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --fix
        language: system
        types_or: [markdown]
